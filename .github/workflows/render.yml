name: Render
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "compositions/**"
      - "assets/**"
      - "hyperframes.json"
      - ".github/workflows/render.yml"
  workflow_dispatch:
    inputs:
      quality:
        description: "Calidad del render"
        type: choice
        options: [draft, looks, delivery]
        default: looks
      frames:
        description: "Segundos para las capturas de revisión (coma)"
        type: string
        default: "0.5,1.5,4.5,7.5,10.5,13.5"

permissions:
  contents: write

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

env:
  HF: npx --yes hyperframes@0.8.204

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ensure FFmpeg
        shell: bash
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "ffmpeg ya viene en el runner"
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi

      - name: Extract frames and audio
        shell: bash
        run: |
          mkdir -p assets/img
          if [ -f assets/videos/target.mp4 ]; then
            ffmpeg -y -i assets/videos/target.mp4 -vf "select=eq(n\,0)" -vsync vfr assets/img/01.jpg
            ffmpeg -y -i assets/videos/target.mp4 -vf "select=eq(n\,1)" -vsync vfr assets/img/02.jpg
            ffmpeg -y -i assets/videos/target.mp4 -vf "select=eq(n\,2)" -vsync vfr assets/img/03.jpg
            ffmpeg -y -i assets/videos/target.mp4 -vf "select=eq(n\,3)" -vsync vfr assets/img/04.jpg
            ffmpeg -y -i assets/videos/target.mp4 -vn -acodec copy assets/audio/target_audio.m4a || true
          fi

      - name: Ensure Chrome
        run: $HF browser ensure

      - name: Check
        shell: bash
        run: |
          set -o pipefail
          $HF check --json | tee check.json

      - name: Render
        shell: bash
        run: |
          mkdir -p out
          $HF render --quality "${{ inputs.quality || 'looks' }}" --output out/video.mp4

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/video.mp4
          retention-days: 14