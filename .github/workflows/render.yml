name: Render

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "compositions/**"
      - "assets/**"
      - "hyperframes.json"
      - ".github/workflows/render.yml"
  workflow_dispatch:
    inputs:
      quality:
        description: "Calidad del render"
        type: choice
        options: [draft, looks, delivery]
        default: looks
      frames:
        description: "Segundos para las capturas de revisión (coma)"
        type: string
        default: "0.6,1.2,2.0,3.5,5.5"

permissions:
  contents: write

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

env:
  HF: npx --yes hyperframes@0.8.204

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: hf-npm-${{ hashFiles('package.json', '.github/workflows/render.yml') }}

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Ensure Chrome
        run: $HF browser ensure

      - name: Check
        shell: bash
        run: |
          set -o pipefail
          $HF check --json | tee check.json

      - name: Snapshots
        if: always()
        shell: bash
        run: |
          $HF snapshot --at "${{ inputs.frames || '0.6,1.2,2.0,3.5,5.5' }}" || true

      - name: Render
        shell: bash
        run: |
          mkdir -p out
          $HF render --quality "${{ inputs.quality || 'looks' }}" --output out/video.mp4

      - name: Upload frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frames
          path: |
            .hyperframes/artifacts/snapshots/
            check.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/video.mp4
          retention-days: 14

      - name: Publish latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest out/video.mp4 \
            --title "Último render" \
            --notes "Generado automáticamente desde ${GITHUB_SHA:0:7}."
