name: Cutout

# Recorta el fondo de las fotos del producto con el modelo local, en la máquina de GitHub.
# Manual: Actions -> Cutout -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      images:
        description: "Imágenes a recortar, separadas por coma (01,02,...)"
        type: string
        default: "01,02,03,04,05"

permissions:
  contents: write

env:
  HF: npx --yes hyperframes@0.8.204

jobs:
  cutout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: hf-npm-${{ hashFiles('package.json') }}

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~/.cache/hyperframes
          key: hf-models-v1

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Cut out
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/cut
          IFS=',' read -ra LIST <<< "${{ inputs.images }}"
          for n in "${LIST[@]}"; do
            n="$(echo "$n" | tr -d '[:space:]')"
            echo "── $n"
            $HF remove-background "assets/img/$n.jpg" -o "out/cut/$n.png" --json
          done
          ls -la out/cut

      - name: Upload cutouts
        uses: actions/upload-artifact@v4
        with:
          name: cutouts
          path: out/cut/
          retention-days: 14
