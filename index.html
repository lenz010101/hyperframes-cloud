<!doctype html>
<html>
<head>

<meta name="viewport" content="width=1080,height=1920"/>
<style>
html,body{width:1080px;height:1920px;margin:0;background:#000;overflow:hidden}

video{width:100%;height:100%;object-fit:cover}
#subs{position:absolute;bottom:140px;left:0;width:100%;text-align:center;color:#fff;font-family:sans-serif;font-size:72px;font-weight:800;text-shadow:0 4px 30px rgba(0,0,0,0.9);padding:0 80px;box-sizing:border-box}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
<div id="stage">
<video src="assets/videos/target.mp4" autoplay muted playsinline></video>
<div id="subs" class="clip" data-start="0" data-duration="15" data-track-index="1">Subtítulos automáticos en español</div>
</div>
</div>
</body>
</html>
