<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0b0d10;
        --ink: #f2f4f8;
        --muted: #b9c3d1;
        --accent: #7cf5c4;
        --font-display: "Inter", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #stage {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
        color: var(--ink);
      }
      #glow {
        position: absolute;
        width: 1400px;
        height: 1400px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(124, 245, 196, 0.16) 0%, rgba(124, 245, 196, 0) 62%);
        transform-origin: 50% 50%;
      }
      #stack {
        position: relative;
        width: 1200px;
      }
      #rule {
        width: 96px;
        height: 4px;
        background: var(--accent);
        transform-origin: 0% 50%;
        margin-bottom: 44px;
      }
      #kicker {
        font-family: var(--font-mono);
        font-size: 30px;
        font-weight: 500;
        letter-spacing: 0.22em;
        color: var(--accent);
        margin-bottom: 26px;
      }
      #title {
        font-size: 124px;
        font-weight: 900;
        line-height: 0.98;
        letter-spacing: -0.035em;
        margin-bottom: 30px;
      }
      #subtitle {
        font-size: 30px;
        font-weight: 400;
        letter-spacing: -0.01em;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    >
      <div id="stage">
        <div id="glow" aria-hidden="true"></div>
        <div id="stack">
          <div id="rule" class="clip" data-start="0" data-duration="6" data-track-index="0"></div>
          <p id="kicker" class="clip" data-start="0" data-duration="6" data-track-index="1">
            HYPERFRAMES · RENDER EN LA NUBE
          </p>
          <h1 id="title" class="clip" data-start="0" data-duration="6" data-track-index="2">
            Todo en la nube
          </h1>
          <p id="subtitle" class="clip" data-start="0" data-duration="6" data-track-index="3">
            GitHub Actions · Chromium + FFmpeg · MP4
          </p>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        "#glow",
        { scale: 0.82, opacity: 0.4 },
        { scale: 1.18, opacity: 0.9, duration: 5.4, ease: "sine.inOut" },
        0
      );
      tl.fromTo(
        "#rule",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.75, ease: "expo.out" },
        0.15
      );
      tl.fromTo(
        "#kicker",
        { y: 24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        0.3
      );
      tl.fromTo(
        "#title",
        { y: 26, scale: 1.035 },
        { y: 0, scale: 1, duration: 1.2, ease: "power4.out" },
        0
      );
      tl.fromTo(
        "#subtitle",
        { y: 28, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
        0.75
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
