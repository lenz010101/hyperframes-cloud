<!doctype html>
<html lang='es'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=1080,height=1920'>
<script src='https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js'></script>
<style>
html,body{width:1080px;height:1920px;margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:100%;height:100%}
#base-video{width:100%;height:100%;object-fit:cover}
#text-overlay{position:absolute;left:50%;top:150px;transform:translateX(-50%);font-family:Montserrat,sans-serif;font-weight:700;font-size:64px;color:#FFFFFF;text-align:center}
#image-overlay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:80%}
</style>
</head>
<body>
<div id='root' data-composition-id='main' data-start='0' data-duration='60' data-width='1080' data-height='1920'>
<div id='stage'>
<video id='base-video' src='assets/videos/base_motorcycle_pov.mp4' autoplay muted playsinline></video>
<div id='text-overlay' class='clip' data-start='0' data-duration='60'>RESCUECHIP</div>
<img id='image-overlay' src='assets/images/mockup_emergency_screen.png' class='clip' data-start='0' data-duration='60' style='display:none'/>
</div>
</div>
<script>
const tl=gsap.timeline();
tl.fromTo('#text-overlay',{opacity:0,y:20},{opacity:1,y:0,duration:1});
</script>
</body>
</html>
