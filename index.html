<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #ffffff;
        --ink: #0f1115;
        --muted: #8b93a1;
        --hairline: #e8eaee;
        --font-display: "Inter", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #stage {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--ground);
        font-family: var(--font-display);
        color: var(--ink);
      }

      .shot {
        position: absolute;
        left: 90px;
        top: 250px;
        width: 900px;
        height: 1300px;
        border-radius: 30px;
        overflow: hidden;
        background: #f2f3f5;
        box-shadow:
          0 34px 74px rgba(15, 17, 21, 0.11),
          0 6px 18px rgba(15, 17, 21, 0.06);
      }
      .shot img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform-origin: 50% 50%;
      }

      #label {
        position: absolute;
        left: 100px;
        top: 1620px;
        width: 880px;
      }
      #label .rule {
        width: 880px;
        height: 1px;
        background: var(--hairline);
        margin-bottom: 30px;
      }
      #label .row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
      }
      #brand {
        font-size: 44px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      #model {
        font-family: var(--font-mono);
        font-size: 30px;
        font-weight: 500;
        letter-spacing: 0.12em;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1080"
      data-height="1920"
    >
      <div id="stage">
        <div id="shot-1" class="clip" data-start="0" data-duration="3" data-track-index="0">
          <div class="shot"><img id="img-1" src="assets/img/01.jpg" alt="Exprimidor USA MILER, frente" style="object-position: 50% 45%" /></div>
        </div>
        <div id="shot-2" class="clip" data-start="3" data-duration="3" data-track-index="0">
          <div class="shot"><img id="img-2" src="assets/img/02.jpg" alt="Exprimidor USA MILER, lateral con marca" style="object-position: 50% 42%" /></div>
        </div>
        <div id="shot-3" class="clip" data-start="6" data-duration="3" data-track-index="0">
          <div class="shot"><img id="img-3" src="assets/img/03.jpg" alt="Dos exprimidores en la mesa" style="object-position: 50% 50%" /></div>
        </div>
        <div id="shot-4" class="clip" data-start="9" data-duration="3" data-track-index="0">
          <div class="shot"><img id="img-4" src="assets/img/04.jpg" alt="Detalle de la canasta y las copas" style="object-position: 50% 35%" /></div>
        </div>
        <div id="shot-5" class="clip" data-start="12" data-duration="3" data-track-index="0">
          <div class="shot"><img id="img-5" src="assets/img/05.jpg" alt="Placa de especificaciones" style="object-position: 50% 50%" /></div>
        </div>

        <div id="label" class="clip" data-start="0" data-duration="15" data-track-index="1">
          <div class="rule"></div>
          <div class="row">
            <div id="brand">USA MILER</div>
            <div id="model">EXPRIMIDOR 20205M</div>
          </div>
        </div>
      </div>
    </div>

    <audio
      id="music"
      src="assets/audio/bed.mp3"
      data-start="0"
      data-duration="15"
      data-timeline-role="music"
    ></audio>

    <script>
      const tl = gsap.timeline({ paused: true });
      const ease = "none";
      const D = 3;

      // cada toma: deriva lenta dentro del encuadre, sin cortes internos
      tl.fromTo("#img-1", { scale: 1.02, y: 0 }, { scale: 1.1, y: -18, duration: D, ease }, 0);
      tl.fromTo("#img-2", { scale: 1.1, x: 6 }, { scale: 1.02, x: -6, duration: D, ease }, 3);
      tl.fromTo("#img-3", { scale: 1.02, x: -8 }, { scale: 1.1, x: 8, duration: D, ease }, 6);
      tl.fromTo("#img-4", { scale: 1.12, y: 10 }, { scale: 1.03, y: -10, duration: D, ease }, 9);
      tl.fromTo("#img-5", { scale: 1.03 }, { scale: 1.12, duration: D, ease }, 12);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
